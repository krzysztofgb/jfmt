name: Lint & Test
on:
  push:
    tags-ignore:
      - '*'
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Tools
        uses: jdx/mise-action@v4

      - name: Lint
        run: task lint

  test:
    name: Test
    uses: ./.github/workflows/test.yml
