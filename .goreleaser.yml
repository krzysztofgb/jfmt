version: 2

before:
  hooks:
    - mkdir -p completions
    - go run ./cmd/jfmt completion zsh > completions/_jfmt
    - go run ./cmd/jfmt completion bash > completions/jfmt.bash
    - go run ./cmd/jfmt completion fish > completions/jfmt.fish
    - go run ./cmd/jfmt completion powershell > completions/jfmt.ps1

builds:
  - main: ./cmd/jfmt
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: completions/*
        dst: completions

binary_signs:
  - {}

homebrew_casks:
  - name: jfmt
    repository:
      owner: krzysztofgb
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/krzysztofgb/jfmt
    description: A JSON formatter and validator for the command line.
    license: Unlicense
    completions:
      zsh: completions/_jfmt
      bash: completions/jfmt.bash
      fish: completions/jfmt.fish
    caveats: |
      Shell completions have been installed. If tab completion is not working,
      ensure your shell is configured to load Homebrew completions.

changelog:
  use: github
  abbrev: -1
  format: "{{.Message}} (@{{.AuthorUsername}})"
  sort: asc
  groups:
    - title: New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+'
      order: 2
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude: []
